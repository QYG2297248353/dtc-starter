# Example deployment using EXTERNAL PostgreSQL and Redis
# (no bundled db/redis containers).
#
# Usage:
#   cp .env.example .env   # then set DATABASE_URL and REDIS_URL in .env
#   docker compose -f docker-compose.external.yml up -d
#
# Prerequisites:
#   - The PostgreSQL database referenced by DATABASE_URL must already exist
#     (Medusa runs migrations but does NOT create the database itself):
#       CREATE DATABASE medusa;
#   - The host must be reachable from this machine.

x-backend-env: &backend-env
  NODE_ENV: production
  # Full connection strings come from .env — required, no defaults.
  # Medusa defaults to SSL for non-localhost hosts (rejectUnauthorized=false),
  # which matches managed/cloud PG. For a PG WITHOUT SSL, append
  # ?sslmode=disable (no underscore), or connections will hang.
  # Examples:
  #   DATABASE_URL=postgres://user:pass@pg.example.com:5432/medusa
  #   DATABASE_URL=postgres://user:pass@pg.example.com:5432/medusa?sslmode=disable
  #   REDIS_URL=redis://:password@redis.example.com:6379/0
  #   REDIS_URL=rediss://:password@redis.example.com:6380/0   (TLS)
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
  REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
  # CORS — set these to your real origins in production
  STORE_CORS: ${STORE_CORS:-http://localhost:8000}
  ADMIN_CORS: ${ADMIN_CORS:-http://localhost:9000}
  AUTH_CORS: ${AUTH_CORS:-http://localhost:9000}
  # Public base URL of the backend. The local file module builds absolute
  # file URLs (product images...) from this. Must match the URL users
  # actually use to reach the backend (scheme + host + port).
  # Defaults to localhost:9000 — override in production, or uploaded
  # image URLs will point at localhost and fail to load.
  BACKEND_URL: ${BACKEND_URL:-http://localhost:9000}
  # Session cookie — Medusa production defaults to Secure+SameSite=None,
  # which breaks plain HTTP deployments. Override via .env:
  #   COOKIE_SECURE=true  COOKIE_SAME_SITE=lax   (HTTPS / reverse-proxy TLS)
  #   COOKIE_SECURE=false COOKIE_SAME_SITE=lax  (plain HTTP test deploy)
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-lax}
  # Alipay (optional). The provider is disabled while these are empty.
  # See .env.example for how to configure the keys and notify URL.
  ALIPAY_APP_ID: ${ALIPAY_APP_ID:-}
  ALIPAY_PRIVATE_KEY: ${ALIPAY_PRIVATE_KEY:-}
  ALIPAY_PUBLIC_KEY: ${ALIPAY_PUBLIC_KEY:-}
  ALIPAY_GATEWAY: ${ALIPAY_GATEWAY:-}
  ALIPAY_NOTIFY_URL: ${ALIPAY_NOTIFY_URL:-}
  ALIPAY_RETURN_URL: ${ALIPAY_RETURN_URL:-}
  ALIPAY_SELLER_ID: ${ALIPAY_SELLER_ID:-}
  ALIPAY_SUBJECT_PREFIX: ${ALIPAY_SUBJECT_PREFIX:-Order}
  # Secrets — MUST be provided (no defaults)
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
  COOKIE_SECRET: ${COOKIE_SECRET:?COOKIE_SECRET is required}

services:
  # One-shot migration job: runs `medusa db:migrate` (migrations +
  # initial data seed) against the built server, then exits.
  # Re-runs automatically on every `up` after `docker compose pull`
  # so schema migrations are applied before the new version starts.
  migrate:
    image: ${MEDUSA_IMAGE:-qyg2297248353/medusa:latest}
    command: ["./node_modules/.bin/medusa", "db:migrate"]
    environment: *backend-env
    restart: "no"

  backend:
    image: ${MEDUSA_IMAGE:-qyg2297248353/medusa:latest}
    restart: unless-stopped
    environment: *backend-env
    ports:
      - "${PORT:-9000}:9000"
    # Uploaded files (product images) live in /server/static. Without this
    # volume they are lost every time the container is recreated.
    # Single-instance only: the local file provider cannot share storage
    # across replicas — use S3 for multi-replica / production setups.
    volumes:
      - medusa_static:/server/static
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  medusa_static:
